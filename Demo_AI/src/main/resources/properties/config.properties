# ============================================================
# DEMO config.properties — safe to commit to GitHub
# secretKey removed — now lives in .env only (never committed)
# ============================================================
browserSource = driverManager
headless = false
retryCount = 0
parallelFlag = false
threadCount = 5
screenShotOnFailure = true
env = DEMO_QA
brand = DEMO
appName = DEMO_Regression
testNGPath = src/main/resources/TestNGXML.xlsx
allure.results.directory = allure-results
singleAllure = true

# BrowserStack — placeholder values, real keys go in .env
bs_user = YOUR_BS_USER
bs_key = YOUR_BS_KEY
android_device = Google Pixel 8 Pro
android_os_version = 14.0
ios_device = iPhone 15 Pro
ios_os_version = 17.0

# Mail — disabled for demo
sendMail = false
SMTP_HOST = smtp.office365.com
SMTP_PORT = 587
emailFrom = demo@example.com
SMTP_Password =
emailTo = demo@example.com

# Azure DevOps — disabled for demo
PAT =
baseUrl = https://dev.azure.com
organization =
project =
apiVersion = 6.0-preview.6
